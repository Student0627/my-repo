version: '3.8'

services:
  fineguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fineguard-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    restart: unless-stopped
